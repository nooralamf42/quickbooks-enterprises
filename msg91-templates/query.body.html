<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
<style>
  [data-ogsc] [bgcolor="#00254a"], [data-ogsc][bgcolor="#00254a"] { background-color: #00254a !important; }
  [data-ogsc] [bgcolor="#F4F4EF"], [data-ogsc][bgcolor="#F4F4EF"] { background-color: #F4F4EF !important; }
  [data-ogsc] [bgcolor="#ffffff"], [data-ogsc][bgcolor="#ffffff"] { background-color: #ffffff !important; }
  [data-ogsc] [bgcolor="#EFF4F9"], [data-ogsc][bgcolor="#EFF4F9"] { background-color: #EFF4F9 !important; }
  [data-ogsc] [bgcolor="#2ca01c"], [data-ogsc][bgcolor="#2ca01c"] { background-color: #2ca01c !important; }
  [data-ogsc] [bgcolor="#21262A"], [data-ogsc][bgcolor="#21262A"] { background-color: #21262A !important; }
  [data-ogsc] [style*="background-color:#f4f5f8"], [data-ogsc][style*="background-color:#f4f5f8"] { background-color: #f4f5f8 !important; }
  [data-ogsc] [style*="background-color:#f4f4ef"], [data-ogsc][style*="background-color:#f4f4ef"] { background-color: #f4f4ef !important; }
  [data-ogsc] [style*="background-color:#ffffff"], [data-ogsc][style*="background-color:#ffffff"] { background-color: #ffffff !important; }
  [data-ogsc] [style*="background-color:#00254a"], [data-ogsc][style*="background-color:#00254a"] { background-color: #00254a !important; }
  [data-ogsc] [style*="color:#000000"], [data-ogsc][style*="color:#000000"] { color: #000000 !important; }
  [data-ogsc] [style*="color:#555555"], [data-ogsc][style*="color:#555555"] { color: #555555 !important; }
  [data-ogsc] body, body[data-ogsc] { background-color: #f4f5f8 !important; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f8">

<div style="margin:0;padding:0;font-family:Avenir,Arial,sans-serif;background-color:#f4f5f8">
  <div style="background-color:#f4f5f8;width:100%">

    
    <table border="0" cellpadding="0" cellspacing="0" width="100%" align="center" bgcolor="#00254a" style="width:100%;max-width:660px;text-align:center;background-color:#00254a">
      <tr>
        <td height="90" align="center" bgcolor="#00254a" style="background-color:#00254a;height:90px">
          <table border="0" cellpadding="0" cellspacing="0" width="100%" align="center" bgcolor="#00254a" style="width:100%;max-width:580px;margin:0 auto;background-color:#00254a">
            <tr>
              <td align="center" valign="middle" bgcolor="#00254a" style="text-align:center;padding:15px 20px;background-color:#00254a">
                <img src="https://www.quickbooks-enterprises.com/template-logo-image.png" alt="QuickBooks Enterprise" width="540" style="display:block;margin:0 auto;border:0;width:100% !important;max-width:540px;height:auto">
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <table bgcolor="#ffffff" border="0" cellpadding="0" cellspacing="0" width="100%" align="center" style="width:100%;max-width:660px">
      <tr>
        <td>
          <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="width:100%;max-width:580px">
            <tr>
              <td style="font-family:Avenir,Arial,sans-serif;text-align:left;font-size:26px;font-weight:600;padding-top:40px;padding-bottom:16px;color:#000000">
                {{#if customer_name}}Hi {{customer_name}},{{else}}Hi,{{/if}}
              </td>
            </tr>
            
      <tr>
        <td>{{#each paragraphs}}<div style="font-family:Avenir,Arial,sans-serif;font-size:16px;line-height:24px;color:#000000;padding-bottom:16px;text-align:left;white-space:pre-line">{{this}}</div>{{/each}}</td>
      </tr>
            <tr><td style="padding-bottom:24px"></td></tr>
          </table>
        </td>
      </tr>
    </table>

    
    <table bgcolor="#ffffff" border="0" cellpadding="0" cellspacing="0" width="100%" align="center" style="text-align:center;width:100%;max-width:660px;background-color:#ffffff">
      <tr>
        <td align="center" style="padding:40px 0px;text-align:center">
          <table bgcolor="#EFF4F9" width="100%" border="0" cellpadding="0" cellspacing="0" align="center" style="padding:38px 0px;width:100%;max-width:580px;border-radius:4px;text-align:center;margin:0 auto;border:1px solid #c3ced5">
            <tr>
              <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" align="center" width="100%" style="width:100%;max-width:500px;margin:0 auto">
                  <tr>
                    <td style="color:#2ca01c;text-align:center;line-height:33px;padding:0 0 20px 0;font-size:26px;font-weight:600;font-family:Avenir,Arial,sans-serif">
                      Questions or concerns?
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="text-align:center">
                      <table align="center" role="presentation" border="0" cellspacing="0" cellpadding="0" style="margin:0 auto;text-align:center">
                        <tr>
                          <td align="center" height="44" style="font-size:16px;color:#2ca01c;font-family:Avenir,Arial,sans-serif;border-radius:4px;border:2px solid #2ca01c;text-decoration:none;height:44px;text-align:center">
                            <a href="tel:+18888298848" style="text-align:center;font-family:Avenir,Arial,sans-serif;color:#2ca01c;text-decoration:none;font-weight:600;font-size:16px;line-height:24px;display:block;margin:0 auto;padding:0 20px">
                              (888) 829-8848
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    
    <table bgcolor="#21262A" border="0" cellpadding="0" cellspacing="0" width="100%" align="center" style="text-align:center;background-color:#21262a;width:100%;max-width:660px">
      <tr>
        <td style="padding-top:40px">
          <table cellspacing="0" cellpadding="0" width="100%" align="center" style="margin:0 auto;width:100%;max-width:580px">
            <tr>
              <td style="color:#ffffff;text-align:left;font-size:12px;line-height:16px;font-weight:400;font-family:Avenir,Arial,sans-serif;padding-bottom:20px">
                This email was sent to {{to_email}} regarding your QuickBooks Enterprise order.
              </td>
            </tr>
            <tr>
              <td style="color:#ffffff;text-align:left;font-size:12px;line-height:16px;font-weight:400;font-family:Avenir,Arial,sans-serif;padding-bottom:20px">
                <a href="https://www.quickbooks-enterprises.com/terms" style="color:#ffffff;text-decoration:underline" target="_blank">Terms of Service</a>
                <br><br>
                &copy; 2026 QuickBooks Enterprise Services.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

  </div>
</div>
</body>
</html>
