 <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>IFrame Communicator</title>
    <script type="text/javascript">
        function sendToParent(str) {
            if (str && str.length > 0) {
                // postMessage to the top window — works across all cross-origin iframe nesting
                window.top.postMessage({ source: 'authnet-communicator', qstr: str }, '*');
            }
        }

        // Listen for postMessage from Authorize.net's own scripts
        function receiveMessage(event) {
            if (event && event.data) {
                sendToParent(event.data);
            }
        }

        if (window.addEventListener) {
            window.addEventListener("message", receiveMessage, false);
        } else if (window.attachEvent) {
            window.attachEvent("onmessage", receiveMessage);
        }

        // Also check URL hash on load (Authorize.net navigates here with hash params)
        if (window.location.hash && window.location.hash.length > 1) {
            sendToParent(window.location.hash.substring(1));
        }

        // Also check URL query string
        if (window.location.search && window.location.search.length > 1) {
            sendToParent(window.location.search.substring(1));
        }
    </script>
</head>
<body>
</body>
</html>
