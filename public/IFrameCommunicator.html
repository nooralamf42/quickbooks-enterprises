<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>IFrame Communicator</title>
    <script type="text/javascript">
        function callParentFunction(str) {
            // Use window.top to reach the top-level Next.js page
            // regardless of how many iframe levels deep we are
            if (str && str.length > 0 && window.top && window.top.CommunicationHandler) {
                window.top.CommunicationHandler(str);
            }
        }

        function receiveMessage() {
            var str = window.location.search;
            if (str && str.length > 1) {
                // strip the leading "?" so URLSearchParams parses correctly
                callParentFunction(str.substring(1));
            } else if (window.location.hash && window.location.hash.length > 1) {
                callParentFunction(window.location.hash.substring(1));
            }
        }
    </script>
</head>
<body onload="receiveMessage()">
</body>
</html>
